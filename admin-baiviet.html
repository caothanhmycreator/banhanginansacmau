<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Bài Viết - CMS Sắc Màu</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    
    <!-- Tích hợp Trình soạn thảo văn bản TinyMCE -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.2/tinymce.min.js"></script>
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP BẢO MẬT CHUNG -->
    <div id="login-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column;">
        <div style="background: rgba(255,255,255,0.02); padding: 40px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); backdrop-filter: blur(10px);">
            <h2 style="color: #fff; margin-top: 0; font-size: 28px; font-weight: 900;">SẮC MÀU <span style="color: #E65100;">CMS</span></h2>
            <p style="color: #94a3b8; margin-bottom: 30px; font-size: 14px;">Vui lòng nhập mật khẩu quản trị</p>
            <input type="password" id="adminPassword" placeholder="Nhập mật khẩu..." style="width: 100%; padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.3); color: #fff; margin-bottom: 20px; box-sizing: border-box; font-family: inherit;">
            <button onclick="checkAdminLogin()" style="width: 100%; padding: 15px; background: linear-gradient(135deg, #E65100 0%, #ff8a65 100%); color: #fff; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(230, 81, 0, 0.4);">ĐĂNG NHẬP</button>
        </div>
    </div>

    <aside>
        <h2>SẮC MÀU <span>CMS</span></h2>
        <ul class="nav-menu">
            <a href="quan-tri.html" style="text-decoration: none;"><li class="nav-item">Tổng Quan</li></a>
            <a href="admin-sanpham.html" style="text-decoration: none;"><li class="nav-item">Sản Phẩm</li></a>
            <a href="admin-donhang.html" style="text-decoration: none;"><li class="nav-item">Quản Lý Đơn Hàng</li></a>
            <a href="admin-baiviet.html" style="text-decoration: none;"><li class="nav-item active">Bài Viết (Blog)</li></a>
            <a href="admin-gioithieu.html" style="text-decoration: none;"><li class="nav-item">Sửa Giới Thiệu</li></a>
            <a href="admin-lienhe.html" style="text-decoration: none;"><li class="nav-item">Thông Tin Liên Hệ</li></a>
        </ul>
        <div style="margin-top: auto; text-align: center;">
            <button onclick="adminLogout()" style="background: transparent; color: #94a3b8; border: 1px solid rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.2s;">Đăng Xuất</button>
        </div>
    </aside>

    <main>
        <div class="panel active">
            
            <h3>Đăng Bài Viết Mới</h3>
            <form id="postForm">
                <input type="hidden" id="postId" value="">

                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>Tiêu đề bài viết</label>
                        <input type="text" id="postTitle" placeholder="Ví dụ: 5 Mẫu Bìa Folder Đẹp Cho Doanh Nghiệp" required>
                    </div>
                    <div class="form-group">
                        <label>Mã ID Link (Slug - Viết liền không dấu)</label>
                        <input type="text" id="postSlug" placeholder="Ví dụ: 5-mau-bia-folder-dep" required>
                    </div>
                    <div class="form-group">
                        <label>Ảnh bìa đại diện (Thumbnail)</label>
                        <input type="file" id="postImage" accept="image/*">
                    </div>
                    <div class="form-group full-width">
                        <label>Đoạn trích dẫn ngắn (Hiển thị ở lưới bài viết ngoài web)</label>
                        <textarea id="postExcerpt" rows="3" placeholder="Tóm tắt nội dung bài viết..." required></textarea>
                    </div>
                    
                    <div class="form-group full-width">
                        <label>Nội dung chi tiết (Soạn thảo văn bản chuyên nghiệp)</label>
                        <!-- Khung này sẽ được TinyMCE tiếp quản -->
                        <textarea id="postContent" placeholder="Nhập nội dung bài viết vào đây..."></textarea>
                    </div>
                </div>
                <button type="button" class="btn-submit" id="submitPostBtn" onclick="processSubmitPost()">Lưu và Xuất Bản Bài Viết</button>
            </form>

            <div style="margin-top: 60px; border-top: 1px solid var(--border-color); padding-top: 40px;">
                <h3 style="font-size: 22px; margin: 0 0 20px; font-weight: 800;">Danh Sách Bài Viết</h3>
                <div style="overflow-x: auto; background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px solid var(--border-color);">
                    <table style="width: 100%; border-collapse: collapse; font-size: 14px; text-align: left;">
                        <thead>
                            <tr style="border-bottom: 1px solid var(--border-color); background: rgba(255,255,255,0.02); color: #94a3b8;">
                                <th style="padding: 15px 20px; width: 80px;">Ảnh bìa</th>
                                <th style="padding: 15px 20px;">Tiêu đề</th>
                                <th style="padding: 15px 20px;">Ngày đăng</th>
                                <th style="padding: 15px 20px; text-align: right; width: 160px;">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="admin-post-list"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Thư viện phụ trợ -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/api.js"></script>
    <script src="js/admin-auth.js"></script>
    <script src="js/admin-baiviet.js"></script>

</body>
</html>
