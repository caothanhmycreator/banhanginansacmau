<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Trang Giới Thiệu - CMS Sắc Màu</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP BẢO MẬT CHUNG -->
    <div id="login-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column;">
        <div style="background: rgba(255,255,255,0.02); padding: 40px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); backdrop-filter: blur(10px);">
            <h2 style="color: #fff; margin-top: 0; font-size: 28px; font-weight: 900;">SẮC MÀU <span style="color: #E65100;">CMS</span></h2>
            <p style="color: #94a3b8; margin-bottom: 30px; font-size: 14px;">Vui lòng nhập mật khẩu quản trị</p>
            <input type="password" id="adminPassword" placeholder="Nhập mật khẩu..." style="width: 100%; padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.3); color: #fff; margin-bottom: 20px; box-sizing: border-box; font-family: inherit;">
            <button onclick="checkAdminLogin()" style="width: 100%; padding: 15px; background: linear-gradient(135deg, #E65100 0%, #ff8a65 100%); color: #fff; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(230, 81, 0, 0.4);">ĐĂNG NHẬP</button>
        </div>
    </div>

    <!-- THANH MENU ĐIỀU HƯỚNG MỚI -->
    <aside>
        <h2>SẮC MÀU <span>CMS</span></h2>
        <ul class="nav-menu">
            <a href="quan-tri.html" style="text-decoration: none;"><li class="nav-item">Tổng Quan</li></a>
            <a href="admin-sanpham.html" style="text-decoration: none;"><li class="nav-item">Sản Phẩm</li></a>
            <a href="admin-donhang.html" style="text-decoration: none;"><li class="nav-item">Quản Lý Đơn Hàng</li></a>
            <a href="admin-baiviet.html" style="text-decoration: none;"><li class="nav-item">Bài Viết (Blog)</li></a>
            <a href="admin-gioithieu.html" style="text-decoration: none;"><li class="nav-item active">Sửa Giới Thiệu</li></a>
            <a href="admin-lienhe.html" style="text-decoration: none;"><li class="nav-item">Thông Tin Liên Hệ</li></a>
        </ul>
        <div style="margin-top: auto; text-align: center;">
            <button onclick="adminLogout()" style="background: transparent; color: #94a3b8; border: 1px solid rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.2s;">Đăng Xuất</button>
        </div>
    </aside>

    <main>
        <!-- KHU VỰC QUẢN LÝ TRANG GIỚI THIỆU -->
        <div class="panel active">
            <h3 style="font-size: 24px; font-weight: 800; margin-bottom: 20px;">Quản Lý Trang Giới Thiệu</h3>
            <form id="introForm">
                <div class="form-group" style="margin-bottom: 20px;">
                    <label>Tiêu đề trang</label>
                    <input type="text" id="introTitle" placeholder="Ví dụ: Về Chúng Tôi - Xưởng In Sắc Màu" required>
                </div>
                
                <div class="form-group full-width" style="margin-bottom: 20px;">
                    <label>Nội dung bài viết (Hỗ trợ mã HTML)</label>
                    <textarea id="introContent" rows="8" placeholder="Viết câu chuyện thương hiệu của sếp vào đây..."></textarea>
                </div>
                
                <div class="form-group full-width" style="margin-bottom: 20px;">
                    <label>Thư viện Slide Hình Ảnh (Có thể chọn nhiều ảnh cùng lúc)</label>
                    <input type="file" id="introGallery" accept="image/*" multiple>
                    <div id="intro-gallery-preview" style="display:flex; gap:12px; margin-top:15px; flex-wrap:wrap;"></div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Khung Thông Tin Liên Hệ</label>
                        <textarea id="introContact" rows="5" placeholder="Địa chỉ: ..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Mã nhúng Bản Đồ (Google Maps Iframe)</label>
                        <textarea id="introMap" rows="5" placeholder='Dán thẻ <iframe src="...">'></textarea>
                    </div>
                </div>
                
                <button type="button" class="btn-submit" id="btnSaveIntro" onclick="saveIntroData()">LƯU CẤU HÌNH TRANG GIỚI THIỆU</button>
            </form>
        </div>
    </main>

    <!-- Tải thư viện và chia nhỏ JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/api.js"></script>
    <script src="js/admin-auth.js"></script>      <!-- Bộ não bảo mật dùng chung -->
    <script src="js/admin-gioithieu.js"></script> <!-- Bộ não riêng cho trang Giới thiệu -->

</body>
</html>
